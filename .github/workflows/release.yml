name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (tsc --noEmit)
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      - name: Release build (bumps build number from the Git tag)
        run: npm run build:release
      - name: Verify version file
        run: cat src/core/updates/common/current-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            src/core/updates/common/current-version.json
